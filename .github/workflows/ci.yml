name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: startkit
          POSTGRES_PASSWORD: startkit
          POSTGRES_DB: startkit
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U startkit -d startkit"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      APP_ENV: test
      PORT: 8000
      CORS_ORIGIN: http://localhost:3000
      DATABASE_URL: postgresql://startkit:startkit@localhost:5432/startkit
      REDIS_URL: redis://localhost:6379/0
      DB_SYNC: 1
      DB_DEBUG: 0
      DB_POOL_MAX: 5
      RATE_LIMIT_MAX: 1000
      RATE_LIMIT_TTL_SECONDS: 60
      WORKER_CONCURRENCY: 2

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.9

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20.6.0
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm run lint

      - name: Build
        run: pnpm run build

      - name: Unit tests
        run: pnpm exec jest --runInBand

      - name: End-to-end tests
        run: pnpm run test:e2e

      - name: Validate Docker Compose
        run: |
          cp .env.sample .env
          docker compose config --quiet

      - name: Validate Nginx gateway
        run: >-
          docker run --rm
          -v "$PWD/deploy/nginx.conf:/etc/nginx/nginx.conf:ro"
          nginx:1.27-alpine nginx -t

      - name: Build Docker image
        run: docker build --tag startkit-nest:ci .

      - name: Horizontal scaling and failure-policy smoke test
        run: bash scripts/ci-smoke.sh
