name: CI

on:
  push:
    branches:
      - main
      - feat/**
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: startkit
          POSTGRES_PASSWORD: startkit
          POSTGRES_DB: startkit
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U startkit -d startkit"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      APP_ENV: test
      PORT: 8000
      CORS_ORIGIN: http://localhost:3000
      DATABASE_URL: postgresql://startkit:startkit@localhost:5432/startkit
      REDIS_URL: redis://localhost:6379/0
      DB_SYNC: 1
      DB_DEBUG: 0
      DB_POOL_MAX: 5
      RATE_LIMIT_MAX: 1000
      RATE_LIMIT_TTL_SECONDS: 60
      WORKER_CONCURRENCY: 2

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm run build

      - name: Unit tests
        run: pnpm exec jest --runInBand

      - name: End-to-end tests
        run: pnpm run test:e2e

      - name: Validate Docker Compose
        run: |
          cp .env.sample .env
          docker compose config --quiet

      - name: Validate Nginx gateway
        run: >-
          docker run --rm
          -v "$PWD/deploy/nginx.conf:/etc/nginx/nginx.conf:ro"
          nginx:1.27-alpine nginx -t

      - name: Build Docker image
        run: docker build --tag startkit-nest:ci .

      - name: Horizontal scaling smoke test
        run: |
          set -euo pipefail
          docker network create startkit-ci

          for replica in 1 2 3; do
            docker run -d \
              --name "startkit-api-${replica}" \
              --network startkit-ci \
              --network-alias api \
              --add-host host.docker.internal:host-gateway \
              -e APP_ENV=production \
              -e PORT=8000 \
              -e CORS_ORIGIN=http://localhost:3000 \
              -e INSTANCE_ID="api-${replica}" \
              -e TRUST_PROXY=1 \
              -e DATABASE_URL=postgresql://startkit:startkit@host.docker.internal:5432/startkit \
              -e REDIS_URL=redis://host.docker.internal:6379/0 \
              -e DB_SYNC=1 \
              -e DB_POOL_MAX=3 \
              -e RATE_LIMIT_MAX=3 \
              -e RATE_LIMIT_TTL_SECONDS=60 \
              startkit-nest:ci
          done

          for replica in 1 2 3; do
            for attempt in $(seq 1 30); do
              if docker exec "startkit-api-${replica}" node -e "fetch('http://127.0.0.1:8000/health/ready').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"; then
                break
              fi
              if [ "$attempt" -eq 30 ]; then
                docker logs "startkit-api-${replica}"
                exit 1
              fi
              sleep 1
            done
          done

          docker run -d \
            --name startkit-gateway \
            --network startkit-ci \
            -p 18000:8000 \
            -v "$PWD/deploy/nginx.conf:/etc/nginx/nginx.conf:ro" \
            nginx:1.27-alpine

          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:18000/health >/dev/null; then
              break
            fi
            if [ "$attempt" -eq 30 ]; then
              docker logs startkit-gateway
              exit 1
            fi
            sleep 1
          done

          node <<'NODE'
          (async () => {
            const ids = new Set();
            for (let i = 0; i < 30; i += 1) {
              const response = await fetch('http://127.0.0.1:18000/health');
              if (!response.ok) throw new Error(`health returned ${response.status}`);
              const body = await response.json();
              ids.add(body.data.instanceId);
            }
            if (ids.size < 2) {
              throw new Error(`gateway did not distribute requests: ${[...ids].join(',')}`);
            }
            console.log(`gateway reached replicas: ${[...ids].join(',')}`);
          })().catch((error) => {
            console.error(error);
            process.exit(1);
          });
          NODE

          node <<'NODE'
          const Redis = require('ioredis');
          (async () => {
            const redis = new Redis('redis://127.0.0.1:6379/0');
            let cursor = '0';
            do {
              const [nextCursor, keys] = await redis.scan(cursor, 'MATCH', 'startkit:rate-limit:*', 'COUNT', 100);
              cursor = nextCursor;
              if (keys.length) await redis.del(...keys);
            } while (cursor !== '0');
            await redis.quit();
          })().catch((error) => {
            console.error(error);
            process.exit(1);
          });
          NODE

          node <<'NODE'
          (async () => {
            const statuses = [];
            const ids = new Set();
            for (let i = 1; i <= 4; i += 1) {
              const response = await fetch('http://127.0.0.1:18000/', {
                headers: { 'x-forwarded-for': `198.51.100.${i}` },
              });
              statuses.push(response.status);
              if (response.status === 200) {
                const body = await response.json();
                ids.add(body.data.instanceId);
              }
            }
            const expected = '200,200,200,429';
            if (statuses.join(',') !== expected) {
              throw new Error(`spoof-resistant shared limit failed: ${statuses.join(',')}`);
            }
            if (ids.size < 2) {
              throw new Error(`rate-limit requests did not cross replicas: ${[...ids].join(',')}`);
            }
            console.log(`shared limit crossed replicas: ${[...ids].join(',')}`);
          })().catch((error) => {
            console.error(error);
            process.exit(1);
          });
          NODE

      - name: Stop horizontal scaling containers
        if: always()
        run: |
          docker rm -f startkit-gateway startkit-api-1 startkit-api-2 startkit-api-3 2>/dev/null || true
          docker network rm startkit-ci 2>/dev/null || true
