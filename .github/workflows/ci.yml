name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: startkit
          POSTGRES_PASSWORD: startkit
          POSTGRES_DB: startkit
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U startkit -d startkit"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      APP_ENV: test
      PORT: 8000
      CORS_ORIGIN: http://localhost:3000
      DATABASE_URL: postgresql://startkit:startkit@localhost:5432/startkit
      REDIS_URL: redis://localhost:6379/0
      DB_SYNC: 1
      DB_DEBUG: 0
      DB_POOL_MAX: 5
      RATE_LIMIT_MAX: 1000
      RATE_LIMIT_TTL_SECONDS: 60
      WORKER_CONCURRENCY: 2

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20.6.0
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm run lint

      - name: Build
        run: pnpm run build

      - name: Unit tests
        run: pnpm exec jest --runInBand

      - name: End-to-end tests
        run: pnpm run test:e2e

      - name: Validate Docker Compose
        run: |
          cp .env.sample .env
          docker compose config --quiet

      - name: Validate Nginx gateway
        run: >-
          docker run --rm
          -v "$PWD/deploy/nginx.conf:/etc/nginx/nginx.conf:ro"
          nginx:1.27-alpine nginx -t

      - name: Build Docker image
        run: docker build --tag startkit-nest:ci .

      - name: Horizontal scaling and failure-policy smoke test
        run: |
          set -euo pipefail
          docker network create startkit-ci

          assert_startup_failure() {
            name="$1"
            expected_message="$2"
            shift 2

            docker run -d --name "$name" "$@" >/dev/null
            sleep 2

            if [ "$(docker inspect -f '{{.State.Running}}' "$name")" = "true" ]; then
              docker logs "$name"
              echo "$name unexpectedly remained running"
              return 1
            fi

            if ! docker logs "$name" 2>&1 | grep -Fq "$expected_message"; then
              docker logs "$name"
              echo "$name failed, but not for the expected guardrail: $expected_message"
              return 1
            fi

            docker rm "$name" >/dev/null
          }

          assert_startup_failure \
            startkit-invalid-env \
            "Invalid APP_ENV value" \
            --network startkit-ci \
            --add-host host.docker.internal:host-gateway \
            -e APP_ENV=prodution \
            -e DATABASE_URL=postgresql://startkit:startkit@host.docker.internal:5432/startkit \
            -e REDIS_URL=redis://host.docker.internal:6379/0 \
            startkit-nest:ci

          assert_startup_failure \
            startkit-invalid-cors \
            "CORS_ORIGIN cannot contain * in production" \
            --network startkit-ci \
            --add-host host.docker.internal:host-gateway \
            -e APP_ENV=production \
            -e CORS_ORIGIN='*' \
            -e DATABASE_URL=postgresql://startkit:startkit@host.docker.internal:5432/startkit \
            -e REDIS_URL=redis://host.docker.internal:6379/0 \
            startkit-nest:ci

          assert_startup_failure \
            startkit-invalid-proxy \
            "TRUST_PROXY=true is not allowed in production" \
            --network startkit-ci \
            --add-host host.docker.internal:host-gateway \
            -e APP_ENV=production \
            -e TRUST_PROXY=true \
            -e DATABASE_URL=postgresql://startkit:startkit@host.docker.internal:5432/startkit \
            -e REDIS_URL=redis://host.docker.internal:6379/0 \
            startkit-nest:ci

          assert_startup_failure \
            startkit-invalid-dbsync \
            "DB_SYNC must be disabled in production" \
            --network startkit-ci \
            --add-host host.docker.internal:host-gateway \
            -e APP_ENV=production \
            -e DATABASE_URL=postgresql://startkit:startkit@host.docker.internal:5432/startkit \
            -e REDIS_URL=redis://host.docker.internal:6379/0 \
            -e DB_SYNC=1 \
            startkit-nest:ci

          docker run --rm \
            --network startkit-ci \
            --add-host host.docker.internal:host-gateway \
            -e APP_ENV=production \
            -e DATABASE_URL=postgresql://startkit:startkit@host.docker.internal:5432/startkit \
            startkit-nest:ci node scripts/typeorm-cli.mjs migration:show

          for replica in 1 2 3; do
            docker run -d \
              --name "startkit-api-${replica}" \
              --network startkit-ci \
              --network-alias api \
              --add-host host.docker.internal:host-gateway \
              -e APP_ENV=production \
              -e PORT=8000 \
              -e CORS_ORIGIN=http://localhost:3000 \
              -e INSTANCE_ID="api-${replica}" \
              -e INTERNAL_ENDPOINT_TOKEN=startkit-ci-internal-token \
              -e TRUST_PROXY=1 \
              -e DATABASE_URL=postgresql://startkit:startkit@host.docker.internal:5432/startkit \
              -e REDIS_URL=redis://host.docker.internal:6379/0 \
              -e DB_SYNC=0 \
              -e DB_POOL_MAX=3 \
              -e RATE_LIMIT_MAX=3 \
              -e RATE_LIMIT_TTL_SECONDS=60 \
              startkit-nest:ci
          done

          for replica in 1 2 3; do
            for attempt in $(seq 1 30); do
              if docker exec "startkit-api-${replica}" node -e "fetch('http://127.0.0.1:8000/health/ready').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"; then
                break
              fi
              if [ "$attempt" -eq 30 ]; then
                docker logs "startkit-api-${replica}"
                exit 1
              fi
              sleep 1
            done
          done

          docker exec startkit-api-1 node -e "fetch('http://127.0.0.1:8000/metrics').then(r=>{if(r.status!==401)process.exit(1)}).catch(()=>process.exit(1))"
          docker exec startkit-api-1 node -e "fetch('http://127.0.0.1:8000/metrics',{headers:{authorization:'Bearer startkit-ci-internal-token'}}).then(async r=>{if(!r.ok)process.exit(1);const body=await r.text();if(!body.includes('startkit_process_uptime_seconds'))process.exit(1)}).catch(()=>process.exit(1))"
          docker exec startkit-api-1 node -e "fetch('http://127.0.0.1:8000/health/dependencies',{headers:{authorization:'Bearer startkit-ci-internal-token'}}).then(async r=>{if(!r.ok)process.exit(1);const body=await r.json();if(body.data.database!=='connected'||body.data.redis!=='connected')process.exit(1)}).catch(()=>process.exit(1))"

          docker run -d \
            --name startkit-worker \
            --network startkit-ci \
            --add-host host.docker.internal:host-gateway \
            -e APP_ENV=production \
            -e REDIS_URL=redis://host.docker.internal:6379/0 \
            -e WORKER_CONCURRENCY=1 \
            startkit-nest:ci node dist/worker.js

          sleep 2
          if [ "$(docker inspect -f '{{.State.Running}}' startkit-worker)" != "true" ]; then
            docker logs startkit-worker
            echo "Worker failed to boot without database configuration"
            exit 1
          fi

          docker run -d \
            --name startkit-api-fail-open \
            --network startkit-ci \
            --add-host host.docker.internal:host-gateway \
            -e APP_ENV=production \
            -e PORT=8000 \
            -e INSTANCE_ID=api-fail-open \
            -e DATABASE_URL=postgresql://startkit:startkit@host.docker.internal:5432/startkit \
            -e REDIS_URL=redis://host.docker.internal:6399/0 \
            -e REDIS_CONNECT_TIMEOUT_MS=500 \
            -e REDIS_COMMAND_TIMEOUT_MS=500 \
            -e RATE_LIMIT_FAIL_OPEN=1 \
            -e DEPENDENCY_CHECK_TIMEOUT_MS=500 \
            startkit-nest:ci

          for attempt in $(seq 1 30); do
            if docker exec startkit-api-fail-open node -e "fetch('http://127.0.0.1:8000/health/ready').then(async r=>{if(!r.ok)process.exit(1);const b=await r.json();if(b.data.redis!=='degraded')process.exit(1)}).catch(()=>process.exit(1))"; then
              break
            fi
            if [ "$attempt" -eq 30 ]; then
              docker logs startkit-api-fail-open
              echo "Fail-open readiness did not tolerate Redis outage"
              exit 1
            fi
            sleep 1
          done

          docker run -d \
            --name startkit-gateway \
            --network startkit-ci \
            -p 18000:8000 \
            -v "$PWD/deploy/nginx.conf:/etc/nginx/nginx.conf:ro" \
            nginx:1.27-alpine

          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:18000/health >/dev/null; then
              break
            fi
            if [ "$attempt" -eq 30 ]; then
              docker logs startkit-gateway
              exit 1
            fi
            sleep 1
          done

          LOAD_URL=http://127.0.0.1:18000/health \
          LOAD_REQUESTS=200 \
          LOAD_CONCURRENCY=20 \
          LOAD_P95_MAX_MS=1000 \
          LOAD_MIN_INSTANCES=2 \
          pnpm run test:load

          node <<'NODE'
          const Redis = require('ioredis');
          (async () => {
            const redis = new Redis('redis://127.0.0.1:6379/0');
            let cursor = '0';
            do {
              const [nextCursor, keys] = await redis.scan(cursor, 'MATCH', 'startkit:rate-limit:*', 'COUNT', 100);
              cursor = nextCursor;
              if (keys.length) await redis.del(...keys);
            } while (cursor !== '0');
            await redis.quit();
          })().catch((error) => {
            console.error(error);
            process.exit(1);
          });
          NODE

          node <<'NODE'
          (async () => {
            const statuses = [];
            const ids = new Set();
            for (let i = 1; i <= 4; i += 1) {
              const response = await fetch('http://127.0.0.1:18000/', {
                headers: { 'x-forwarded-for': `198.51.100.${i}` },
              });
              statuses.push(response.status);
              if (response.status === 200) {
                const body = await response.json();
                ids.add(body.data.instanceId);
              }
            }
            const expected = '200,200,200,429';
            if (statuses.join(',') !== expected) {
              throw new Error(`spoof-resistant shared limit failed: ${statuses.join(',')}`);
            }
            if (ids.size < 2) {
              throw new Error(`rate-limit requests did not cross replicas: ${[...ids].join(',')}`);
            }
            console.log(`shared limit crossed replicas: ${[...ids].join(',')}`);
          })().catch((error) => {
            console.error(error);
            process.exit(1);
          });
          NODE

      - name: Stop smoke-test containers
        if: always()
        run: |
          docker rm -f \
            startkit-invalid-env \
            startkit-invalid-cors \
            startkit-invalid-proxy \
            startkit-invalid-dbsync \
            startkit-gateway \
            startkit-api-fail-open \
            startkit-worker \
            startkit-api-1 \
            startkit-api-2 \
            startkit-api-3 \
            2>/dev/null || true
          docker network rm startkit-ci 2>/dev/null || true
