services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: startkit
      POSTGRES_PASSWORD: startkit
      POSTGRES_DB: startkit
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U startkit -d startkit"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: .
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://startkit:startkit@postgres:5432/startkit
      REDIS_URL: redis://redis:6379/0
    command: ["node", "dist/main.js"]
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker:
    build: .
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://startkit:startkit@postgres:5432/startkit
      REDIS_URL: redis://redis:6379/0
    command: ["node", "dist/worker.js"]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  postgres_data:
